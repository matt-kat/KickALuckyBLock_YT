<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Car Crash Test Simulator</title>
        <script src="https://www.youtube.com/game_api/v1"></script>
        <script>
            // The YouTube Test Suite serves the game from its original host,
            // while Playgama normally detects YouTube by its production host.
            // Mark only Test Suite launches as YouTube before Bridge starts.
            (() => {
                const hashParameters = new URLSearchParams(window.location.hash.slice(1));
                const testSuiteOrigin = hashParameters.get('origin') || '';

                if (
                    hashParameters.has('debug') &&
                    testSuiteOrigin.startsWith(
                        'https://developers.google.com/youtube/gaming/playables/test_suite'
                    )
                ) {
                    const testSuiteUrl = new URL(window.location.href);
                    testSuiteUrl.searchParams.set('platform_id', 'youtube');
                    window.history.replaceState(null, '', testSuiteUrl);
                }
            })();
        </script>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/KickALuckyBLock_YT.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/KickALuckyBLock_YT.data.unityweb" as="fetch" crossorigin>
        <link rel="preload" href="Build/KickALuckyBLock_YT.framework.js.unityweb" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
